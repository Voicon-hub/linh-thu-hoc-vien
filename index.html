<style>
:root{--bg:#0a1024;--bg2:#1a1648;--card:rgba(30,36,80,.7);--gold:#e8c35a;--tx:#e9ecff;--mu:#9aa3d0;--ln:rgba(232,195,90,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:var(--tx);background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 60%) fixed;min-height:100vh}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;background:rgba(8,12,34,.9);border-bottom:1px solid var(--ln);flex-wrap:wrap}
header b{color:var(--gold);font-size:18px;letter-spacing:.5px;margin-right:auto}
.chip{background:rgba(232,195,90,.12);border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:rgba(8,12,34,.7);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
nav button{flex:0 0 auto;white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{color:var(--gold);margin:4px 0 12px;font-weight:600}
h3{margin:0 0 6px}
button{font:inherit;cursor:pointer;color:var(--tx);background:rgba(60,64,140,.5);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;transition:.15s}
button:hover:not(:disabled){box-shadow:0 0 12px rgba(232,195,90,.35);transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on,button.gold{background:linear-gradient(135deg,#f3d77c,#c9972b);color:#1a1230;font-weight:700;border-color:#f3d77c}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.bar{height:10px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7b5cff,var(--gold))}
.bar.hp i{background:linear-gradient(90deg,#e0455a,#5be08a)}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pet{text-align:center;position:relative;border-width:2px;cursor:default}
.pet .em{font-size:44px;line-height:1.2;filter:drop-shadow(0 0 10px var(--c))}
.pet .rr{position:absolute;top:6px;left:8px;font-weight:800;font-size:13px}
.pet .st{display:grid;grid-template-columns:1fr 1fr;font-size:12px;color:var(--mu);margin-top:4px}
.lock{opacity:.35;filter:grayscale(1)}
.sel{outline:3px solid var(--gold)}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{background:#1f6b45;border-color:#5be08a}.opt.no{background:#6b1f2e;border-color:#e0455a}
.arena{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.arena .pet{padding:6px 2px}.arena .em{font-size:30px}.arena .pet b{font-size:11px;display:block}
.cur{box-shadow:0 0 16px var(--gold);border-color:var(--gold)}.dead{opacity:.25}
@media(max-width:640px){.arena{grid-template-columns:repeat(3,1fr)}}
.log{max-height:150px;overflow:auto;font-size:13px;color:var(--mu)}
.log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:20;width:92%;max-width:420px}
#toast div{background:#241c5c;border:1px solid var(--gold);border-radius:10px;padding:10px 14px;box-shadow:0 0 20px rgba(232,195,90,.4);animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.gate{font-size:90px;text-align:center;filter:drop-shadow(0 0 25px #8a6bff)}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.big{text-align:center}
.pet{position:relative}.hit{animation:shk .45s}@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}}
.atkp{animation:lup .45s}@keyframes lup{50%{transform:translateY(-12px) scale(1.06)}}.atke{animation:ldn .45s}@keyframes ldn{50%{transform:translateY(12px) scale(1.06)}}
.dmg{position:absolute;left:50%;top:25%;transform:translateX(-50%);font-weight:800;color:#ff6b6b;font-size:18px;text-shadow:0 0 6px #000;animation:fu .9s forwards;pointer-events:none;z-index:2}.dmg.sk{color:var(--gold);font-size:24px}@keyframes fu{to{opacity:0;top:-10%}}
.fxo{position:absolute;inset:0;border-radius:14px;box-shadow:0 0 30px 10px var(--c);animation:fo .6s forwards;pointer-events:none}@keyframes fo{from{opacity:.9}to{opacity:0}}
.banner{text-align:center;font-size:20px;color:var(--gold);font-weight:700;text-shadow:0 0 12px var(--gold);animation:in .3s}
.pet .sr{position:absolute;top:6px;right:8px;font-size:13px;color:var(--gold);font-weight:700}
.rr-R{box-shadow:0 0 8px #9aa7c755}.rr-SR{box-shadow:0 0 14px #4fc3f788}.rr-SSR{box-shadow:0 0 20px #b388ffaa;animation:pl 2s infinite}.rr-UR{box-shadow:0 0 26px #ffb74dbb;animation:pl 1.6s infinite}.rr-LR{box-shadow:0 0 34px #ff5c8acc;animation:pl 1.2s infinite;background:linear-gradient(135deg,rgba(255,92,138,.25),rgba(232,195,90,.25))}
@keyframes pl{50%{filter:brightness(1.35)}}
.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,var(--c),transparent 70%);animation:fl 1.4s ease-out forwards;z-index:25}@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.modal{position:fixed;inset:0;background:rgba(5,8,25,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}.modal>div{max-width:440px;width:100%;max-height:88vh;overflow:auto;background:#141a45}
</style></head><body>

// Cấu trúc: topic{id,name,icon,desc,lessons[]} → lesson{id,title,theory[],example,questions[]} → question{q,o[4],a(0-3),e}
const REW={first:{exp:8,pts:10,perfExp:20,perfPts:30},retry:{exp:2,pts:3,max:3},improve:{exp:4,pts:5},exam:{exp:.5,pts:.8},pass:70,qn:10};

const BASE=[
{id:"t1",name:"Tài Trợ Thương Mại (CDCS)",icon:"🏦",desc:"UCP 600 và kiểm tra chứng từ – biên soạn lại theo giáo trình CDCS đính kèm",lessons:[
{id:"u1",title:"UCP 600: Nền tảng của tín dụng chứng từ",theory:["UCP 600 là bộ quy tắc của Phòng Thương mại Quốc tế (ICC), có hiệu lực từ 1/7/2007 và thay thế UCP 500. Quy tắc chỉ áp dụng khi L/C ghi rõ chịu sự điều chỉnh của UCP 600.","Tín dụng chứng từ là cam kết của ngân hàng phát hành sẽ thanh toán (honour) cho người thụ hưởng nếu xuất trình phù hợp. Theo Điều 3, L/C luôn không hủy ngang, kể cả khi không ghi rõ.","• Điều 4 – Tính độc lập: L/C tách biệt khỏi hợp đồng mua bán.","• Điều 5 – Ngân hàng xử lý chứng từ, không xử lý hàng hóa hay dịch vụ.","• Điều 8 – Ngân hàng xác nhận có cam kết độc lập thêm vào cam kết của ngân hàng phát hành.","• Điều 14(b) – Thời hạn kiểm tra tối đa 5 ngày làm việc ngân hàng sau ngày xuất trình (UCP 500 chỉ nêu “thời gian hợp lý”, không quá 7 ngày)."],example:"Công ty A (Việt Nam) bán cà phê cho công ty B (Đức) theo L/C. Hàng đến nơi, B phàn nàn chất lượng. Nếu bộ chứng từ của A phù hợp với L/C, ngân hàng phát hành vẫn phải thanh toán; tranh chấp chất lượng được giải quyết riêng giữa A và B.",questions:[
qq("UCP 600 là bộ quy tắc do tổ chức nào ban hành?",["Phòng Thương mại Quốc tế (ICC)","Tổ chức Thương mại Thế giới (WTO)","Quỹ Tiền tệ Quốc tế (IMF)","Ngân hàng Thế giới (World Bank)"],0,"UCP là ấn phẩm của ICC, bản UCP 600 có hiệu lực từ 1/7/2007."),
qq("UCP 600 thay thế phiên bản nào và có hiệu lực từ khi nào?",["UCP 400, từ 1/1/1990","UCP 500, từ 1/7/2007","UCP 500, từ 1/1/2000","UCP 300, từ 1/7/1993"],1,"UCP 600 thay UCP 500 và áp dụng từ 1/7/2007."),
qq("Theo UCP 600, một tín dụng chứng từ có thể thuộc loại nào?",["Hủy ngang nếu người mua yêu cầu","Chỉ hủy ngang khi L/C ghi rõ","Luôn không hủy ngang, kể cả khi L/C không nêu rõ","Hủy ngang trong 7 ngày đầu"],2,"Điều 3: L/C là không hủy ngang dù không ghi rõ; UCP 600 bỏ khái niệm L/C hủy ngang."),
qq("Người mua phàn nàn hàng kém chất lượng, nhưng chứng từ xuất trình phù hợp. Ngân hàng phát hành nên làm gì?",["Từ chối vì hàng kém chất lượng","Thanh toán, vì cam kết độc lập với hợp đồng mua bán","Chờ người mua kiểm hàng xong","Trả chứng từ cho người bán"],1,"Điều 4: L/C độc lập với hợp đồng; tranh chấp hàng hóa giải quyết giữa người mua và người bán."),
qq("Theo Điều 5, ngân hàng giao dịch với đối tượng nào?",["Hàng hóa","Dịch vụ","Chứng từ","Năng lực của người vận chuyển"],2,"Ngân hàng chỉ xử lý chứng từ, không xử lý hàng hóa, dịch vụ hay việc thực hiện hợp đồng."),
qq("Thời hạn tối đa để ngân hàng kiểm tra bộ chứng từ là bao lâu?",["2 ngày làm việc","5 ngày làm việc ngân hàng sau ngày xuất trình","7 ngày làm việc","10 ngày lịch"],1,"Điều 14(b) UCP 600 đặt mức tối đa 5 ngày làm việc ngân hàng sau ngày xuất trình."),
qq("Trong L/C, “người thụ hưởng” (beneficiary) thường là ai?",["Người nhập khẩu","Người xuất khẩu được hưởng L/C","Ngân hàng thông báo","Công ty bảo hiểm"],1,"Người thụ hưởng thường là người bán/xuất khẩu; người nhập khẩu là người yêu cầu mở L/C (applicant)."),
qq("Ngân hàng xác nhận (confirming bank) có vai trò gì?",["Chỉ thông báo L/C","Thêm cam kết honour/negotiate độc lập bên cạnh ngân hàng phát hành","Thay người mua trả tiền hàng","Kiểm tra chất lượng hàng"],1,"Điều 8: ngân hàng xác nhận chịu cam kết riêng với người thụ hưởng khi xuất trình phù hợp."),
qq("“Xuất trình phù hợp” (complying presentation) là xuất trình thế nào?",["Xuất trình đúng giờ làm việc","Phù hợp điều kiện L/C, UCP 600 và thông lệ ngân hàng tiêu chuẩn quốc tế","Chỉ xuất trình bản sao","Có chữ ký của người mua"],1,"Điều 2 định nghĩa dựa trên ba căn cứ: điều kiện L/C, UCP 600 và thông lệ ngân hàng tiêu chuẩn quốc tế."),
qq("Khi chứng từ có sai biệt, UCP 600 cho phép ngân hàng phát hành làm gì?",["Tự sửa chứng từ","Liên hệ người yêu cầu mở L/C xin miễn trừ, nhưng không kéo dài thời hạn 5 ngày","Im lặng đến khi L/C hết hạn","Thanh toán rồi yêu cầu sửa sau"],1,"Điều 16: ngân hàng có thể xin miễn trừ, nhưng thời hạn kiểm tra theo Điều 14(b) không được kéo dài.")]},
{id:"u2",title:"Kiểm tra chứng từ và thời hạn xuất trình",theory:["Điều 14(a): ngân hàng kiểm tra chứng từ chỉ dựa trên bề mặt (on their face) để xác định có phù hợp hay không.","Điều 14(c): bộ chứng từ gồm chứng từ vận tải gốc phải được xuất trình không muộn hơn 21 ngày lịch sau ngày giao hàng, và không muộn hơn ngày hết hạn L/C.","Điều 14(d): dữ liệu trong chứng từ không cần giống hệt nhưng không được mâu thuẫn với chính chứng từ đó, chứng từ khác hoặc L/C. Điều 14(e): mô tả hàng trên chứng từ khác hóa đơn có thể nêu chung, miễn không mâu thuẫn.","• Điều 17: phải xuất trình ít nhất một bản gốc của mỗi chứng từ yêu cầu.","• Điều 16: thông báo từ chối phải nêu mọi sai biệt làm cơ sở từ chối.","• Điều 29: ngày hết hạn trùng ngày ngân hàng nghỉ (không phải bất khả kháng) sẽ lùi sang ngày làm việc kế tiếp."],example:"Hàng giao 10/4 (ngày phát hành B/L), L/C hết hạn 30/6. Hạn xuất trình tối đa theo quy tắc 21 ngày là 1/5 (10/4 + 21 ngày). Nếu giao hàng 20/6 thì 21 ngày sẽ đến 11/7, nhưng vì L/C hết hạn 30/6 nên hạn chót vẫn là 30/6.",questions:[
qq("Nếu L/C không quy định khác, thời hạn xuất trình mặc định sau ngày giao hàng là?",["7 ngày lịch","10 ngày làm việc","21 ngày lịch","30 ngày lịch"],2,"Điều 14(c) đặt mặc định 21 ngày lịch sau ngày giao hàng."),
qq("L/C hết hạn 30/6, giao hàng 20/6. Hạn chót xuất trình là?",["20/6","27/6","30/6","11/7"],2,"21 ngày sau 20/6 là 11/7 nhưng không được vượt ngày hết hạn L/C, nên hạn chót là 30/6."),
qq("Giao hàng ngày 10/4, L/C hết hạn 30/6. Hạn chót xuất trình theo quy tắc 21 ngày là?",["24/4","1/5","10/5","30/6"],1,"10/4 cộng 21 ngày lịch = 1/5 (tháng 4 có 30 ngày)."),
qq("Điều 14(d) yêu cầu dữ liệu giữa các chứng từ thế nào?",["Phải giống hệt từng chữ","Không được mâu thuẫn với chứng từ, chứng từ khác hoặc L/C","Chỉ cần đúng ở hóa đơn","Không cần kiểm tra"],1,"Dữ liệu không cần y hệt nhưng không được xung đột."),
qq("Mô tả hàng hóa trên chứng từ nào phải tương ứng với mô tả trong L/C?",["Hóa đơn thương mại","Vận đơn","Chứng nhận bảo hiểm","Phiếu đóng gói"],0,"Điều 18(c): hóa đơn thương mại phải tương ứng mô tả hàng trong L/C."),
qq("Thông báo từ chối chứng từ hợp lệ cần nêu điều gì?",["Chỉ cần ghi “chứng từ không phù hợp”","Mọi sai biệt làm cơ sở từ chối","Chỉ sai biệt đầu tiên","Lý do thương mại của người mua"],1,"Điều 16(c): thông báo phải nêu từng sai biệt làm cơ sở từ chối."),
qq("Theo Điều 17, nếu L/C yêu cầu một chứng từ, người thụ hưởng cần xuất trình tối thiểu gì?",["Một bản sao","Ít nhất một bản gốc","Hai bản gốc","Bản fax"],1,"Phải có ít nhất một bản gốc của mỗi chứng từ được quy định."),
qq("Ngày hết hạn L/C trùng ngày ngân hàng nghỉ lễ (không phải bất khả kháng). Hạn xuất trình được xử lý thế nào?",["Chấm dứt vào ngày trước đó","Lùi sang ngày làm việc ngân hàng kế tiếp","Hết hiệu lực ngay","Do người mua quyết định"],1,"Điều 29(a): hạn được kéo dài đến ngày làm việc đầu tiên tiếp theo."),
qq("Điều 14(a) quy định ngân hàng đánh giá chứng từ dựa trên điều gì?",["Điều tra thực tế lô hàng","Bề mặt chứng từ (on their face)","Ý kiến của người mua","Hợp đồng mua bán"],1,"Ngân hàng chỉ xét chứng từ trên bề mặt, không xác minh thực tế hàng hóa."),
qq("Thời hạn kiểm tra tối đa 5 ngày làm việc của ngân hàng có bị rút ngắn khi ngày hết hạn L/C sắp đến không?",["Có, rút còn 2 ngày","Có, rút còn 1 ngày","Không, không bị rút ngắn hay ảnh hưởng","Có, nếu người mua yêu cầu"],2,"Điều 14(b): thời hạn không bị rút ngắn hay ảnh hưởng bởi ngày hết hạn xảy ra vào hoặc sau ngày xuất trình.")]}]},
{id:"t2",name:"Tiếng Anh",icon:"🔤",desc:"Ngữ pháp thiết yếu cho công việc và giao tiếp",lessons:[
{id:"e1",title:"Thì hiện tại hoàn thành (Present Perfect)",theory:["Cấu trúc: have/has + quá khứ phân từ (V3). Phủ định: haven't/hasn't + V3. Nghi vấn: Have/Has + chủ ngữ + V3?","Dùng để nói về kinh nghiệm (ever, never), việc vừa xảy ra (just, already, yet) hoặc việc bắt đầu trong quá khứ và còn liên quan đến hiện tại (for, since).","• for + khoảng thời gian: for five years. since + mốc thời gian: since 2018.","• Không dùng với mốc quá khứ xác định như yesterday, last week, in 2010 (dùng quá khứ đơn)."],example:"I have worked in this company for five years. She has already sent the report. Have you ever visited Da Nang?",questions:[
qq("She ___ in Hanoi since 2018.",["lives","has lived","lived","is living"],1,"Since + mốc thời gian, hành động kéo dài đến nay nên dùng hiện tại hoàn thành."),
qq("I have never ___ sushi.",["eat","ate","eaten","eating"],2,"Quá khứ phân từ của eat là eaten."),

// ===== TRIỆU HỒI =====
const rnd=()=>{try{return crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}catch(e){return Math.random()}};
function rollR(min){const ks=RK.slice(RK.indexOf(min||"R")),tot=ks.reduce((a,k)=>a+CFG.rates[k],0);let x=rnd()*tot;for(const k of ks){if(x<CFG.rates[k])return k;x-=CFG.rates[k]}return ks[ks.length-1]}
const rollP=min=>{const r=rollR(min),pool=PETS.filter(p=>p.r==r);return pool[Math.floor(rnd()*pool.length)]};
const stt=(p,s=1)=>{const f=1+CFG.starBonus*(s-1);return{hp:Math.round(p.hp*f),atk:Math.round(p.atk*f),def:Math.round(p.def*f),spd:Math.round(p.spd*f)}};
const star=p=>S.own[p.id]?S.own[p.id].star:1;
const pw=p=>{const t=stt(p,star(p));return t.hp/5+t.atk+t.def+t.spd};
const costOf=n=>n==10?CFG.cost10:CFG.cost1;
function ask(n){if(!RATE_OK||V.anim)return;if(S.pts<costOf(n))return toast("Không đủ 💎 điểm triệu hồi!");V.cf=n;render()}
function doSummon(n){V.cf=null;const cost=costOf(n);if(!RATE_OK||V.anim)return;if(S.pts<cost){toast("Không đủ 💎 điểm triệu hồi!");return render()}
S.pts-=cost;const res=[];
for(let i=0;i<n;i++){const need=n==10&&i==9&&!res.some(x=>RK.indexOf(x.p.r)>=RK.indexOf(CFG.guarantee10));const p=rollP(need?CFG.guarantee10:"R"),o=S.own[p.id];let tag;
if(!o){S.own[p.id]={star:1,dup:0};tag="new"}else if(o.star>=CFG.maxStar){S.pts+=CFG.dupRefund;tag="refund"}else{o.dup++;tag="dup"}res.push({p,tag})}
S.summons+=n;S.q.s=1;S.hist.unshift({t:new Date().toLocaleString("vi-VN"),n,cost,res:res.map(x=>({id:x.p.id,tag:x.tag}))});S.hist=S.hist.slice(0,CFG.hist);
const best=res.reduce((a,b)=>RK.indexOf(b.p.r)>RK.indexOf(a.p.r)?b:a).p;lg(`Triệu hồi ${n} lần (-${cost} 💎), tốt nhất: ${best.n} (${best.r})`);save();
V.anim=true;V.res=null;V.flash=null;render();
setTimeout(()=>{V.anim=false;V.res=res;V.fl=RK.indexOf(best.r)>=2?best.r:null;render();V.fl=null;toast(`🔮 Nhận ${res.filter(x=>x.tag=="new").length} linh thú mới! Tốt nhất: ${best.n} (${best.r})`)},1100)}
const resCard=(x,i)=>`<div style="animation:in .5s both;animation-delay:${i*.12}s">${petCard(x.p,"rr-"+x.p.r,star(x.p))}<div class="mu" style="text-align:center;margin:-6px 0 8px">${x.tag=="new"?"🆕 Mở khóa mới!":x.tag=="dup"?"➕ Bản trùng – dùng để ghép sao":"💎 Đã đạt ★10: +"+CFG.dupRefund+" 💎"}</div></div>`;
const summonV=()=>{const fl=V.fl?`<div class="flash" style="--c:${RC[V.fl]}"></div>`:"";const c1=S.pts>=CFG.cost1,c10=S.pts>=CFG.cost10;
return`${fl}<h2>Cổng Triệu Hồi</h2>${RATE_OK?"":'<div class="card" style="border-color:#e0455a">⚠️ Cấu hình xác suất không hợp lệ (tổng khác 100%). Triệu hồi bị khóa.</div>'}<div class="card big"><div class="gate ${V.anim?"spin":""}">🌀</div><p class="mu">Tỉ lệ: ${RK.map(k=>`<span style="color:${RC[k]}">${k} ${CFG.rates[k]}%</span>`).join(" · ")}<br>Bản trùng dùng để ghép sao (tối đa ★${CFG.maxStar}). Mười lần đảm bảo ít nhất một ${CFG.guarantee10}+.</p><p>Bạn có: <b>💎 ${S.pts}</b></p><button class="gold" onclick="ask(1)" ${V.anim||!RATE_OK||!c1?"disabled":""}>Triệu hồi ×1 (${CFG.cost1} 💎)</button> <button class="gold" onclick="ask(10)" ${V.anim||!RATE_OK||!c10?"disabled":""}>Triệu hồi ×10 (${CFG.cost10} 💎)</button>${!c1?`<p class="mu">Thiếu ${CFG.cost1-S.pts} 💎. Hãy học bài, làm nhiệm vụ hoặc thắng trận để nhận thêm.</p>`:""}<p><button onclick="go('hist')">📜 Lịch sử triệu hồi</button> <button onclick="go('coll')">🐾 Bộ sưu tập</button></p></div>${V.res?`<div class="grid">${V.res.map(resCard).join("")}</div>`:""}${V.cf?modal(`<h3>Xác nhận triệu hồi ×${V.cf}</h3><p>Chi phí: <b>${costOf(V.cf)} 💎</b><br>Hiện có: ${S.pts} 💎 → còn lại: <b>${S.pts-costOf(V.cf)} 💎</b></p><div class="row"><button class="gold" onclick="doSummon(${V.cf})">Xác nhận</button><button onclick="V.cf=null;render()">Hủy</button></div>`):""}`};

function merge(id){const o=S.own[id];if(!o||o.dup<1||o.star>=CFG.maxStar)return;o.dup--;o.star++;const p=PETS[id];lg(`Ghép sao ${p.n} lên ★${o.star}`);toast(`⭐ ${p.n} lên ★${o.star}!`);if(o.star>=CFG.maxStar&&o.dup>0){S.pts+=o.dup*CFG.dupRefund;toast(`Đạt ★${CFG.maxStar}: đổi ${o.dup} bản dư thành ${o.dup*CFG.dupRefund} 💎`);o.dup=0}save();render()}
function detail(p){const o=S.own[p.id],s=o?o.star:1,t=stt(p,s),nx=o&&s<CFG.maxStar?stt(p,s+1):null,ar=(a,b)=>nx?`${a} <span class="mu">→ ${b}</span>`:a;
return modal(`<div class="big pet" style="--c:${EC[p.el]}"><div class="em" style="font-size:70px;${o?"":"filter:brightness(0)"}">${p.e}</div><h2 style="margin:0">${o?p.n:"Chưa mở khóa"}</h2><div style="color:${RC[p.r]}"><b>${p.r}</b> · <span style="color:${EC[p.el]}">●</span> ${p.el} · ${p.ro}</div>${o?`<div style="color:var(--gold);font-size:18px">${"★".repeat(s)}<span class="mu">${"☆".repeat(CFG.maxStar-s)}</span></div>`:""}</div>${o?`<p>${p.d}</p><div class="st" style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><span>❤ HP ${ar(t.hp,nx&&nx.hp)}</span><span>⚔ ATK ${ar(t.atk,nx&&nx.atk)}</span><span>🛡 DEF ${ar(t.def,nx&&nx.def)}</span><span>💨 SPD ${ar(t.spd,nx&&nx.spd)}</span></div><p><b>Kỹ năng: ${p.sk}</b><br><span class="mu">${SKDESC}</span></p><p class="mu">Bản trùng: ${o.dup}. Ghép 1 bản trùng vào linh thú này để tăng 1 sao (tối đa ★${CFG.maxStar}), mỗi sao +${CFG.starBonus*100}% chỉ số gốc.</p><button class="gold" onclick="merge(${p.id})" ${o.dup<1||s>=CFG.maxStar?"disabled":""}>${s>=CFG.maxStar?"Đã đạt ★"+CFG.maxStar:"Ghép sao → ★"+(s+1)}</button> `:`<p class="mu">Linh thú này chưa được mở khóa. Hãy triệu hồi để nhận. Hình dạng và chỉ số sẽ hiện sau khi sở hữu.</p><button class="gold" onclick="V.cs=null;go('summon')">Đến cổng triệu hồi</button> `}<button onclick="V.cs=null;render()">Đóng</button>`)}
const histV=()=>{const cnt={R:0,SR:0,SSR:0,UR:0,LR:0};let sp=0;S.hist.forEach(h=>{sp+=h.cost;h.res.forEach(r=>cnt[PETS[r.id].r]++)});
return`<h2>Lịch Sử Triệu Hồi</h2><div class="card"><p>Tổng số lần triệu hồi: <b>${S.summons}</b> · Chi ${sp} 💎 (trong ${S.hist.length} đợt gần nhất)</p><div class="row">${RK.map(k=>`<span class="chip" style="color:${RC[k]}">${k}: ${cnt[k]}</span>`).join("")}</div></div>${S.hist.map(h=>`<div class="card"><div class="mu">${h.t} · Triệu hồi ×${h.n} · -${h.cost} 💎</div><div class="row" style="margin-top:6px">${h.res.map(r=>{const p=PETS[r.id];return`<span class="chip" style="border-color:${RC[p.r]};color:${RC[p.r]}" title="${p.n}">${p.e} ${p.n} ${p.r}${r.tag=="new"?" 🆕":""}</span>`}).join("")}</div></div>`).join("")||'<div class="card">Chưa có lần triệu hồi nào.</div>'}<button class="gold" onclick="go('summon')">Về cổng triệu hồi</button>`};

// ===== ĐẤU TRƯỜNG PvE =====
// --- Engine: logic thuần, không đụng DOM. Đổi luật bằng RULES hoặc sửa Engine mà không cần sửa giao diện ---
const RULES={skillMult:1.8,skillCd:2,adv:1.3,dis:.8,varLo:.9,varHi:1.1,defK:.5,minDmg:1,maxRounds:30};
const Engine={
unit(p,side,s,i){return{uid:side+i,id:p.id,n:p.n,e:p.e,el:p.el,r:p.r,sk:p.sk,side,hp:s.hp,max:s.hp,atk:s.atk,def:s.def,spd:s.spd,cd:0}},
alive(B,side){return B.u.filter(u=>u.side==side&&u.hp>0)},
mult(a,d,R){return ADV[a.el]==d.el?R.adv:ADV[d.el]==a.el?R.dis:1},
damage(B,a,d,skill){const R=B.rules,v=R.varLo+B.rng()*(R.varHi-R.varLo);return Math.max(R.minDmg,Math.round(a.atk*(skill?R.skillMult:1)*Engine.mult(a,d,R)*v-d.def*R.defK))},
create(P,E,o={}){const B={rules:{...RULES,...o.rules},rng:o.rng||Math.random,ai:o.ai||0,u:[...P,...E],q:[],round:0,log:["⚔️ Trận chiến bắt đầu!"],over:null,cur:null,last:null};Engine.next(B);return B},
next(B){while(!B.over){if(!Engine.alive(B,"e").length){B.over="win";break}if(!Engine.alive(B,"p").length){B.over="lose";break}
if(!B.q.length){if(B.round>=B.rules.maxRounds){B.over="draw";B.log.unshift("🤝 Hết "+B.rules.maxRounds+" vòng: hòa!");break}B.round++;B.q=B.u.filter(u=>u.hp>0).sort((a,b)=>b.spd-a.spd||(a.side==b.side?0:a.side=="p"?-1:1)||a.uid.localeCompare(b.uid));B.log.unshift(`— Vòng ${B.round} —`)}
const u=B.q.shift();if(u.hp>0){B.cur=u;return}}
B.cur=null;if(B.over=="win")B.log.unshift("🏆 Đội máy bị loại hết!");if(B.over=="lose")B.log.unshift("💀 Đội bạn bị loại hết!")},
act(B,kind,tid){const u=B.cur;if(B.over||!u)return{ok:false,err:"Trận đã kết thúc"};const sk=kind=="skill";if(sk&&u.cd>0)return{ok:false,err:"Kỹ năng đang hồi chiêu"};
const t=B.u.find(x=>x.uid==tid);if(!t||t.hp<=0||t.side==u.side)return{ok:false,err:"Mục tiêu không hợp lệ"};
if(!sk&&u.cd>0)u.cd--;if(sk)u.cd=B.rules.skillCd;const adv=Engine.mult(u,t,B.rules),d=Math.min(t.hp,Engine.damage(B,u,t,sk));t.hp=Math.max(0,t.hp-d);
B.log.unshift(`${u.e} ${u.n} ${sk?"dùng ["+u.sk+"]":"tấn công"} ${t.e} ${t.n}: -${d} HP${adv>1?" (khắc hệ!)":adv<1?" (bị kháng)":""}${t.hp==0?" 💀 bị loại":""}`);
B.last={src:u.uid,tgt:t.uid,dmg:d,skill:sk,adv,killed:t.hp==0,t:Date.now()};Engine.next(B);return{ok:true,...B.last}},
ai(B){const u=B.cur,foes=Engine.alive(B,u.side=="p"?"e":"p"),R=B.rules;let t;
if(B.ai==0)t=foes[Math.floor(B.rng()*foes.length)];else if(B.ai==1)t=[...foes].sort((a,b)=>Engine.mult(u,b,R)-Engine.mult(u,a,R)||a.hp-b.hp)[0];else t=[...foes].sort((a,b)=>a.hp-b.hp)[0];
const sk=u.cd==0&&(B.ai>0||B.rng()<.5);return{kind:sk?"skill":"basic",tid:t.uid}},
surrender(B){if(!B.over){B.over="lose";B.cur=null;B.log.unshift("🏳️ Bạn đã đầu hàng.")}}};
const powOf=s=>s.hp/5+s.atk+s.def+s.spd;
function validTeam(U){if(!U.length||U.length>6)return false;const ids=new Set();return U.every(u=>{const p=PETS[u.id];if(!p||p.n!=u.n||p.el!=u.el||ids.has(u.id))return false;ids.add(u.id);return[u.hp,u.max,u.atk,u.def,u.spd].every(v=>Number.isInteger(v)&&v>0)&&u.hp<=u.max})}
// --- Màn chơi: 3 độ khó × 10 cấp, sức mạnh đội máy tăng nghiêm ngặt theo thứ tự màn ---
const PVE={tiers:[{n:"Dễ",ic:"🌱",ai:0},{n:"Thường",ic:"⚔️",ai:1},{n:"Khó",ic:"👑",ai:2}],levels:10,basePower:130,growth:1.09,rew:{exp:20,pts:30,growth:1.1},repeat:{max:2,frac:.25}};
const targetPower=k=>PVE.basePower*Math.pow(PVE.growth,k);
const stageRew=k=>({exp:Math.round(PVE.rew.exp*Math.pow(PVE.rew.growth,k)),pts:Math.round(PVE.rew.pts*Math.pow(PVE.rew.growth,k))});
const prng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function stageTeam(t,l){const k=t*PVE.levels+l-1,r=prng(k*7919+13),hi=Math.min(4,t+1+(l>=6?1:0)),c=PETS.filter(p=>{const i=RK.indexOf(p.r);return i>=t&&i<=hi}),n=Math.min(6,3+t+Math.floor((l-1)/3)),pk=[];
while(pk.length<n&&c.length)pk.push(c.splice(Math.floor(r()*c.length),1)[0]);const b=pk.map(p=>stt(p,1)),sc=targetPower(k)/b.reduce((a,x)=>a+powOf(x),0);
return pk.map((p,i)=>Engine.unit(p,"e",{hp:Math.max(1,Math.round(b[i].hp*sc)),atk:Math.max(1,Math.round(b[i].atk*sc)),def:Math.max(1,Math.round(b[i].def*sc)),spd:Math.max(1,Math.round(b[i].spd*sc))},i))}
const unlocked=k=>k==0||(S.pve[k-1]&&S.pve[k-1].w>0);
function myTeam(){return[...new Set(S.team)].filter(i=>S.own[i]&&PETS[i]).slice(0,6).map((id,i)=>Engine.unit(PETS[id],"p",stt(PETS[id],star(PETS[id])),i))}
const sumP=U=>Math.round(U.reduce((a,u)=>a+powOf(u),0));
// --- Điều phối trận (nối engine với giao diện) ---
function startStage(k){if(!unlocked(k))return toast("🔒 Hãy vượt màn trước để mở khóa!");const P=myTeam();if(!P.length){toast("Hãy chọn ít nhất 1 linh thú vào đội hình!");return go("team")}
const t=Math.floor(k/PVE.levels),l=k%PVE.levels+1,E=stageTeam(t,l);if(!validTeam(P)||!validTeam(E))return toast("❌ Đội hình không hợp lệ!");
B=Engine.create(P,E,{ai:PVE.tiers[t].ai});B.k=k;B.sel=null;B.busy=false;B.fin=false;V.scr="arena";render();scrollTo(0,0);tick(B)}
function tick(b){if(B!==b)return;if(b.over)return finishB(b);if(b.cur.side=="e"){b.busy=true;render();setTimeout(()=>{if(B!==b||b.over)return;const a=Engine.ai(b);Engine.act(b,a.kind,a.tid);after(b)},750)}else{b.busy=false;render()}}
const after=b=>{render();setTimeout(()=>tick(b),700)};
function pAct(kind){const b=B;if(!b||b.busy||b.over||!b.cur||b.cur.side!="p")return;const foes=Engine.alive(b,"e"),t=foes.find(x=>x.uid==b.sel)||foes[0];const r=Engine.act(b,kind,t.uid);if(!r.ok)return toast(r.err);b.busy=true;after(b)}
function giveUp(){if(B&&!B.over&&confirm("Đầu hàng và tính là thua?")){Engine.surrender(B);finishB(B)}}
function finishB(b){if(b.fin)return;b.fin=true;const k=b.k,pr=S.pve[k]||(S.pve[k]={w:0});let exp=0,pts=0,mult=0;
if(b.over=="win"){const r=stageRew(k);mult=pr.w==0?1:pr.w<=PVE.repeat.max?PVE.repeat.frac:0;exp=Math.round(r.exp*mult);pts=Math.round(r.pts*mult);pr.w++;S.wins++;S.q.b=1;if(exp)addExp(exp);S.pts+=pts}
else if(b.over=="lose")S.losses++;else S.draws=(S.draws||0)+1;
b.rw={exp,pts,mult,first:b.over=="win"&&pr.w==1};const nm=`${PVE.tiers[Math.floor(k/10)].n} ${k%10+1}`;
lg(`Đấu trường ${nm}: ${b.over=="win"?"THẮNG":b.over=="lose"?"THUA":"HÒA"} (+${exp} EXP, +${pts} 💎)`);
toast(b.over=="win"?(exp||pts?`🏆 Chiến thắng! +${exp} EXP, +${pts} 💎`:"🏆 Chiến thắng! Màn này đã hết lượt nhận thưởng."):b.over=="lose"?"💀 Thất bại. Hãy nâng sao hoặc đổi đội hình!":"🤝 Trận hòa, không có thưởng.");save();render()}
// --- Giao diện ---
const stl=u=>`❤${u.hp} ⚔${u.atk} 🛡${u.def} 💨${u.spd}`;
function bunit(u){const L=B.last,f=L&&Date.now()-L.t<650,c=B.cur===u;
return`<div class="card pet ${u.hp<=0?"dead":""} ${c?"cur":""} ${B.sel==u.uid?"sel":""} ${f&&L.src==u.uid?(u.side=="p"?"atkp":"atke"):""} ${f&&L.tgt==u.uid?"hit":""}" style="--c:${EC[u.el]};border-color:${RC[u.r]}" ${u.side=="e"&&u.hp>0&&!B.over?`onclick="B.sel='${u.uid}';render()"`:""}>${f&&L.tgt==u.uid?`<span class="fxo"></span><span class="dmg ${L.skill?"sk":""}">-${L.dmg}</span>`:""}<div class="em">${u.e}</div><b>${u.n}</b><div class="bar hp"><i style="width:${u.hp/u.max*100}%"></i></div><span class="mu" style="font-size:11px">${u.hp}/${u.max} · ${u.el}</span><span class="mu" style="font-size:10px;display:block">${u.atk}⚔ ${u.def}🛡 ${u.spd}💨</span><span class="mu" style="font-size:10px">${u.hp<=0?"Bị loại":u.cd>0?"KN sau "+u.cd+" lượt":"KN sẵn sàng"}</span></div>`}
function battleV(){const c=B.cur,L=B.last,f=L&&Date.now()-L.t<650,su=f&&L.skill?B.u.find(x=>x.uid==L.src):null,t=Math.floor(B.k/10),nm=`${PVE.tiers[t].n} ${B.k%10+1}`;
return`<h2>${PVE.tiers[t].ic} ${nm} · Vòng ${B.round}/${B.rules.maxRounds}</h2>${su?`<div class="banner">${su.e} ${su.sk}!</div>`:""}<div class="mu">Đội máy (bấm để chọn mục tiêu)</div><div class="arena">${B.u.filter(u=>u.side=="e").map(bunit).join("")}</div><div class="card big" style="margin:12px 0">${B.over?"":c&&c.side=="p"&&!B.busy?`<b>Lượt của ${c.e} ${c.n}</b> <span class="mu">${c.atk}⚔ ${c.def}🛡 ${c.spd}💨 · Kỹ năng: ${c.sk}</span><div class="row" style="justify-content:center;margin-top:8px"><button class="gold" onclick="pAct('basic')">Đánh thường</button><button class="gold" onclick="pAct('skill')" ${c.cd>0?"disabled":""}>${c.sk} ${c.cd>0?"(hồi "+c.cd+")":"×"+B.rules.skillMult}</button><button onclick="giveUp()">Đầu hàng</button></div>`:`<span class="mu">${c?c.e+" "+c.n+" đang hành động…":"…"}</span>`}${B.over?"":`<div class="mu" style="margin-top:8px">Thứ tự (SPD): ${[c,...B.q].filter(x=>x&&x.hp>0).map(x=>`<span style="color:${x.side=="p"?"#7fd1ff":"#ff9a9a"}">${x.e}${x.spd}</span>`).join(" → ")}</div>`}</div><div class="arena">${B.u.filter(u=>u.side=="p").map(bunit).join("")}</div><div class="card log" style="margin-top:12px">${B.log.slice(0,30).map(l=>`<div>${l}</div>`).join("")}</div>${B.over&&B.rw?resultV2():""}`}
function resultV2(){const o=B.over,r=B.rw,k=B.k;return`<div class="modal"><div class="card big"><h2>${o=="win"?"🏆 Chiến thắng!":o=="lose"?"💀 Thất bại":"🤝 Hòa"}</h2><p>${o=="win"?(r.exp||r.pts?`${r.first?"Thưởng lần đầu":"Thưởng chơi lại ("+r.mult*100+"%)"}: <b>+${r.exp} EXP · +${r.pts} 💎</b>`:"Màn này đã hết lượt nhận thưởng trong bản demo."):o=="lose"?"Không có thưởng. Hãy ghép sao hoặc đổi đội hình rồi thử lại.":"Hết số vòng tối đa, hai bên chưa phân thắng bại. Không có thưởng."}</p><p class="mu">Còn sống: ${Engine.alive(B,"p").length}/${B.u.filter(u=>u.side=="p").length} linh thú của bạn</p><div class="row" style="justify-content:center"><button class="gold" onclick="startStage(${k})">Chơi lại</button>${o=="win"&&k<29?`<button class="gold" onclick="startStage(${k+1})">Màn tiếp theo</button>`:""}<button onclick="V.stage=${k};B=null;render()">Chọn màn</button><button onclick="go('team')">Đội hình</button></div></div></div>`}
function stageV(){const t=V.tier||0,mine=myTeam(),mp=sumP(mine),sel=V.stage!=null&&Math.floor(V.stage/10)==t?V.stage:null;
return`<h2>Đấu Trường PvE</h2><div class="card"><div class="row"><b style="flex:1">Đội hình (${mine.length}/6) · Sức mạnh ${mp}</b><button onclick="go('team')">Sửa đội hình</button></div><div class="row" style="margin-top:8px">${mine.map(u=>`<span class="chip">${u.e} ${u.n} ★${star(PETS[u.id])}</span>`).join("")||"Chưa có linh thú."}</div></div><div class="row" style="margin-bottom:10px">${PVE.tiers.map((x,i)=>`<button class="${t==i?"on":""}" onclick="V.tier=${i};V.stage=null;render()">${x.ic} ${x.n}</button>`).join("")}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${Array.from({length:10},(_,i)=>{const k=t*10+i,w=S.pve[k]&&S.pve[k].w,lk=!unlocked(k),r=stageRew(k);return`<div class="card" style="cursor:pointer;margin:0;${lk?"opacity:.5;":""}${sel==k?"outline:3px solid var(--gold);":""}" onclick="V.stage=${k};render()"><b>${lk?"🔒":w?"✅":"▶"} ${PVE.tiers[t].n} ${i+1}</b><div class="mu">Địch ~${Math.round(targetPower(k))}</div><div class="mu">+${r.exp} EXP · +${r.pts} 💎</div></div>`}).join("")}</div>${sel!=null?(()=>{const k=sel,E=stageTeam(t,k%10+1),w=S.pve[k]?S.pve[k].w:0,r=stageRew(k);return`<div class="card" style="margin-top:12px"><h3>${PVE.tiers[t].n} ${k%10+1} · ${E.length} linh thú địch</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${E.map(u=>`<div class="mu">${u.e} <b>${u.n}</b> (${u.r}, ${u.el})<br>${stl(u)}</div>`).join("")}</div><p class="mu">Thưởng: ${w==0?`lần đầu +${r.exp} EXP, +${r.pts} 💎`:w<=PVE.repeat.max?`chơi lại ${PVE.repeat.frac*100}%: +${Math.round(r.exp*PVE.repeat.frac)} EXP, +${Math.round(r.pts*PVE.repeat.frac)} 💎 (còn ${PVE.repeat.max+1-w} lượt)`:"đã hết lượt nhận thưởng"}. Đã thắng ${w} lần.</p><button class="gold" onclick="startStage(${k})" ${unlocked(k)?"":"disabled"}>${unlocked(k)?"⚔️ Chiến đấu":"🔒 Chưa mở khóa"}</button></div>`})():""}`}
const arena=()=>B?battleV():stageV();
// ===== TRANG CHỦ / HỒ SƠ =====
function claim(k){const q=QUESTS.find(x=>x[0]==k);S.qc[k]=1;addExp(q[2]);S.pts+=q[3];lg("Nhận thưởng nhiệm vụ");toast(`🎁 Nhận +${q[2]} EXP, +${q[3]} 💎`);save();render()}
const home=()=>`<h2>Chào mừng, Tân Pháp Sư!</h2><div class="card"><h3>Cấp ${S.lv}</h3>${bar(S.exp,need())}<div class="mu">EXP ${S.exp}/${need()} · 💎 ${S.pts} điểm triệu hồi</div><div class="row" style="margin-top:10px"><button class="gold" onclick="go('academy')">📚 Học ngay</button><button onclick="go('summon')">🔮 Triệu hồi</button><button onclick="go('arena')">⚔️ Chiến đấu</button></div></div><div class="card"><h3>Nhiệm vụ hôm nay</h3>${QUESTS.map(q=>`<div class="row" style="padding:6px 0"><span style="flex:1">${S.q[q[0]]?"✅":"⬜"} ${q[1]} <span class="mu">(+${q[2]} EXP, +${q[3]} 💎)</span></span><button class="gold" onclick="claim('${q[0]}')" ${!S.q[q[0]]||S.qc[q[0]]?"disabled":""}>${S.qc[q[0]]?"Đã nhận":"Nhận thưởng"}</button></div>`).join("")}</div><div class="card"><h3>Hoạt động gần đây</h3>${S.log.slice(0,5).map(l=>`<div class="mu">• ${l.m}</div>`).join("")||'<span class="mu">Chưa có hoạt động.</span>'}</div>`;
const profile=()=>`<h2>Hồ Sơ Người Chơi</h2><div class="card"><h3>🧙 Cấp ${S.lv}</h3>${bar(S.exp,need())}<p class="mu">Thắng ${S.wins} · Thua ${S.losses} · Triệu hồi ${S.summons} · Bài đã học ${Object.keys(S.done).length} · Linh thú ${Object.keys(S.own).length}/${PETS.length}</p></div><div class="card"><h3>Thành tựu</h3>${ACH.map(a=>`<div style="padding:4px 0;${a[2]()?"":"opacity:.4"}">${a[2]()?"🏅":"🔒"} <b>${a[0]}</b> <span class="mu">— ${a[1]}</span></div>`).join("")}</div><div class="card"><h3>Lịch sử hoạt động</h3><div class="log" style="max-height:220px">${S.log.map(l=>`<div>${l.t} — ${l.m}</div>`).join("")||"Chưa có."}</div></div><div class="card"><h3>🧪 Công cụ thử nghiệm</h3><p class="mu">Chỉ dùng cho bản demo, không phải thanh toán thật.</p><button class="gold" onclick="S.pts+=10000;lg('Nhận 10.000 💎 (chế độ thử nghiệm)');save();toast('🧪 +10.000 💎 (thử nghiệm)');render()">+10.000 💎 để thử nghiệm</button></div><button onclick="if(confirm('Xóa toàn bộ tiến độ demo?')){S=init();save();go('home');toast('Đã đặt lại tiến độ.')}">Đặt lại tiến độ</button>`;
const NAV=[["home","🏠 Trang chủ",home],["academy","📚 Học viện",academy],["summon","🔮 Triệu hồi",summonV],["coll","🐾 Bộ sưu tập",collection],["hist","📜 Lịch sử",histV],["team","🛡️ Đội hình",team],["arena","⚔️ Đấu trường",arena],["profile","👤 Hồ sơ",profile]];
function render(){$("hl").textContent="Cấp "+S.lv;$("hp").textContent="💎 "+S.pts;$("nav").innerHTML=NAV.map(n=>`<button class="${V.scr==n[0]?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("");$("app").innerHTML=NAV.find(n=>n[0]==V.scr)[2]()}
render();
</script><script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
